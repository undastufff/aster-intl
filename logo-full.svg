    <rect x=".75" y=".75" width="78.5" height="78.5" rx="21.25" fill="none" stroke="rgba(246,228,167,.22)" stroke-width="1.5"/>
  </g>
  <g>
    <text x="106" y="42" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing="8" fill="#F7F3E8">ASTER</text>
    <text x="108" y="64" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Hiragino Sans, PingFang SC, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="3.4" fill="#C8A45C">国際教育 · JAPAN STUDY</text>
