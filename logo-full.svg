<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="title desc">
  <title id="title">Aster International logo</title>
  <desc id="desc">Minimal four-point Aster logo with Apple-inspired spacing and typography.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="6" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10213A"/>
      <stop offset="1" stop-color="#06101D"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="14" x2="68" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E4A7"/>
      <stop offset=".52" stop-color="#C8A45C"/>
      <stop offset="1" stop-color="#8E6B31"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 4)">
